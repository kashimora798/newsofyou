<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Nothing here belongs in a search engine. The decoy portal still looks
         like an ordinary study site to a person; it just never gets indexed. -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />

    <title>EduflowAi</title>
    <meta name="description" content="Study dashboard" />

    <!-- The two origins the first screen actually talks to. -->
    <link rel="preconnect" href="https://itjukxjshcobpibmbrzq.supabase.co" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!--
      A first paint that is already the app's colour, inlined so it costs no
      request and no round trip. React replaces this the moment it mounts.
    -->
    <style>
      html { background: #0f172a; }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: radial-gradient(ellipse at 50% 0%, #1e293b 0%, #0f172a 70%);
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }
      #boot .mark { opacity: 0.9; font-size: 15px; }
      #boot .dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 6px;
        border-radius: 50%;
        background: currentColor;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%, 100% { opacity: 0.25 } 50% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #boot .dot { animation: none } }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot"><div class="mark">EduflowAi<span class="dot"></span></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
